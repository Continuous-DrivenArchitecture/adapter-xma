name: CI
# CDA finalization: re-verified 2026-08-23 under allowed_actions=selected (github_owned_allowed=true).

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm sbom --sbom-format=spdx --omit=dev > sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # Stable, matrix-independent required status check (CDA npm Library
  # Profile v1, "CI"): the Protect main ruleset targets ONLY this job's
  # name. Adding/removing a Node version in the `validate` matrix never
  # requires touching the ruleset's required-checks list -- only this
  # job's `needs:` array changes. `needs: [validate]` alone already waits
  # for every matrix leg (GitHub Actions requires all instances of a
  # matrix job to complete before a dependent job runs), so the legs are
  # not enumerated individually here.
  ci-required:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, audit, sbom]
    steps:
      - name: Verify every required job succeeded
        run: |
          for result in \
            "${{ needs.validate.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.sbom.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::at least one required job did not succeed"
              exit 1
            fi
          done
          echo "All required CI jobs passed."

  release:
    needs: [validate, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No NPM_TOKEN: publishes via npm Trusted Publishing (OIDC), using the
      # id-token: write permission above. Requires the "Continuous-Drivenarchitecture/adapter-xma"
      # + this workflow file to be registered as a Trusted Publisher on the
      # @cda/adapter-xma package on npmjs.com (Package settings -> Trusted Publisher).
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
